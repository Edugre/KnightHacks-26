# BoT-SORT defaults, but a lost track is kept 90 frames (3.6 s at 25 fps) instead of 30.
# Compared with bench/compare_people.py --tracker; see DETECTOR_OPTIONS.md / IMPLEMENTATION.md for results.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
