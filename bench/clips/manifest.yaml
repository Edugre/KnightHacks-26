# Benchmark clips. Video files are gitignored; this list records where each one came from.
#   id         name used by bench/labels/<id>.json and bench/requests.yaml
#   file       path under bench/clips/
#   source     who recorded it or where it was downloaded from
#   consent    who agreed to be filmed, or why no consent is needed (IMPLEMENTATION.md section 1)
#   duration   seconds
#   synthetic  true = bench/run_bench.py regenerates it with scripts/make_test_clip.py when missing
clips:
  - id: synthetic
    file: synthetic.mp4
    source: scripts/make_test_clip.py (1280x720, 30 fps, shapes only)
    consent: not needed, no real people, faces or plates
    duration: 6.0
    synthetic: true
    notes: >-
      Plumbing check for the stub detector, which replays the ground-truth sidecar.
      YOLOE finds nothing in it, so it says nothing about real recall.

