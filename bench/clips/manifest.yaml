# Benchmark clips. Video files are gitignored; this list records where each one came from.
#   id         name used by bench/labels/<id>.json and bench/requests.yaml
#   file       path under bench/clips/
#   source     who recorded it or where it was downloaded from
#   consent    who agreed to be filmed, or why no consent is needed (IMPLEMENTATION.md section 1)
#   duration   seconds
#   synthetic  true = bench/run_bench.py regenerates it with scripts/make_test_clip.py when missing
clips:
  - id: synthetic
    file: synthetic.mp4
    source: scripts/make_test_clip.py (1280x720, 30 fps, shapes only)
    consent: not needed, no real people, faces or plates
    duration: 6.0
    synthetic: true
    notes: >-
      Plumbing check for the stub detector, which replays the ground-truth sidecar.
      YOLOE finds nothing in it, so it says nothing about real recall.

  - id: street_talk
    file: street_talk.mp4
    source: >-
      Pexels video 4625295 "Video Of People Talking On Side Street" by olia danilevich,
      https://www.pexels.com/video/video-of-people-talking-on-side-street-4625295/
      (file: https://videos.pexels.com/video-files/4625295/4625295-hd_1920_1080_25fps.mp4)
    consent: Pexels license (free to use, no attribution required); stock footage published by the creator
    duration: 20.6
    notes: >-
      1920x1080, 25 fps. Three people talking face to face: man in a navy tee, man in a dark denim shirt with
      a backpack, woman in a salmon-red tee. Parked cars behind them, side-on, plates too small to read.
      A blurred woman stands in the background at the left edge (about x 20-80, frames 70-510).
      Labeled (every 10th frame): the three faces and the three people, descs "man, navy tee",
      "man, denim shirt", "woman, salmon tee". No plates and not the background woman.

  - id: street_walk
    file: street_walk.mp4
    source: >-
      Pexels video 4625331 "Video Of People Talking While Walking" by olia danilevich,
      https://www.pexels.com/video/video-of-people-talking-while-walking-4625331/
      (file: https://videos.pexels.com/video-files/4625331/4625331-hd_1920_1080_25fps.mp4, served as 1280x720)
    consent: Pexels license (free to use, no attribution required); stock footage published by the creator
    duration: 8.8
    notes: >-
      1280x720, 25 fps. The same three people walking toward the camera: "man, red hoodie",
      "man, black tee" (curly hair) and "woman, rust top". A dark car with a visible rear plate on the left
      in the first ~1 s, and a few small, distant plates later. No other pedestrians in focus.
      Labeled (every 10th frame): the three faces, the three people and 5 plates.

  - id: street_plates
    file: street_plates.mp4
    source: >-
      Pexels video 5845229 "Busy People In The Street Wearing Face Masks",
      https://www.pexels.com/video/busy-people-in-the-street-wearing-face-masks-5845229/
      (file: https://videos.pexels.com/video-files/5845229/5845229-hd_1920_1080_25fps.mp4),
      first 13.0 s only: ffmpeg -i <file> -t 13 -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -an street_plates.mp4
    consent: Pexels license (free to use, no attribution required); stock footage published by the creator
    duration: 13.0
    notes: >-
      1920x1080, 25 fps, night street in Hong Kong. Rear plates of taxis: "UL 7246" close up at the start,
      partial plates as cars pass, "UK 2189" sharp from ~11 s. A masked crowd is on the pavement from the
      start, dense from ~1.6 s. The full video's crowd half (13 s on) was cut because 30+ faces per frame
      are too slow to label by hand.
      Labeled (every 10th frame): 6 plates, and only the 13 largest, clearest faces (not every crowd face),
      so face recall here counts those only. Persons are not labeled: person recall and over-blur on this
      clip mean nothing.

