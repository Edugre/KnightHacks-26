<style>
  :root {
    --acc:#4d6bff; --acc-down:#3d56d6; --acc-hi:#9fb0ff; --acc-tint:rgba(77,107,255,.16);
    --gridbg:#474545; --panel:#201f1f; --well:#141313; --field:#2d2b2b;
    --text:#f8f4f4; --mute:#bab6b6; --divider:rgba(248,244,244,.26); --hair:rgba(248,244,244,.11); --seg:#9b9797;
    --ink:#f3f2f2; --ink-dark:#201e1d; --err:#ff8f8f;
    --font:"Archivo", system-ui, sans-serif; --mono:ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing:border-box; border-radius:0; }
  html, body { height:100%; margin:0; }
  body { background:var(--gridbg); color:var(--text); font:400 13px/1.4 var(--font); font-variant-numeric:tabular-nums; overflow:hidden; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:1px solid var(--divider); padding:4px 10px; }
  button:hover:not(:disabled) { background:color-mix(in srgb, var(--text) 7%, transparent); }
  button:disabled { opacity:.4; cursor:default; }
  :focus { outline:none; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  a { color:var(--acc-hi); } a:hover { color:#b5c2ff; }
  [hidden] { display:none !important; }
  svg { display:block; flex:none; }
  .primary { display:flex; align-items:center; justify-content:flex-start; gap:8px; width:100%; background:var(--acc); border:0; color:#fff;
    padding:11px 14px; font:800 14px/1.2 var(--font); text-decoration:none; }
  .primary:hover:not(:disabled) { background:var(--acc-down); color:#fff; }
  .primary:disabled { opacity:.4; }
  .h { display:flex; align-items:baseline; gap:10px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; flex:none; }
  .h .n { color:var(--acc-hi); }
  .h .meta { margin-left:auto; font-weight:400; letter-spacing:0; text-transform:none; color:var(--mute); }
  .mute { color:var(--mute); }

  /* ---- the grid: 2px gaps on the rule color read as rules between panels ---- */
  #app { height:100%; display:grid; gap:2px; grid-template-rows:52px minmax(0,1fr) 184px; grid-template-columns:300px minmax(0,1fr) 360px; }
  header { grid-column:1 / -1; display:flex; align-items:center; gap:18px; padding:0 18px 0 12px; background:var(--panel); min-width:0; }
  header img { width:34px; height:34px; }
  .vrule { width:2px; height:20px; background:var(--divider); flex:none; }
  #fileName { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #fileMeta { font-size:12px; color:var(--mute); white-space:nowrap; }
  .head-right { margin-left:auto; display:flex; align-items:center; gap:16px; font-size:12px; }
  .head-right button { font-size:11px; font-weight:600; padding:2px 8px; }

  #left { grid-row:2; grid-column:1; display:flex; flex-direction:column; gap:2px; min-height:0; }
  .panel { background:var(--panel); padding:14px 16px; }
  #reqPanel { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  #text { width:100%; resize:none; background:var(--field); border:1px solid var(--divider); padding:12px;
    font:800 19px/1.18 var(--font); letter-spacing:-.01em; min-height:84px; max-height:220px; caret-color:var(--acc); }
  #text:focus-visible { outline:none; border-color:var(--acc-hi); }
  #text.running { border-color:var(--acc); }
  #text::placeholder { color:var(--mute); font-weight:600; }
  #genProg { position:relative; display:flex; align-items:center; padding:11px 14px; background:var(--field); border:1px solid var(--acc);
    font:800 14px/1.2 var(--font); overflow:hidden; }
  #genProg span { position:relative; }
  .indet { position:absolute; top:0; bottom:0; width:35%; background:var(--acc-tint); animation:indet 1.6s ease-in-out infinite; }
  @keyframes indet { 0% { left:-35%; } 100% { left:100%; } }
  .try { display:flex; flex-direction:column; }
  .try .th { display:flex; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); padding-bottom:5px; border-bottom:2px solid var(--divider); }
  .try .th span { margin-left:auto; letter-spacing:0; text-transform:none; }
  .try button { border:0; border-bottom:1px solid var(--hair); padding:5px 0; font-size:12.5px; line-height:1.35; text-align:left; }
  .try button:hover:not(:disabled) { color:var(--acc-hi); background:none; }
  #expPanel { display:flex; flex-direction:column; gap:8px; flex:none; }
  .exTitle { display:flex; align-items:center; gap:8px; font:800 18px/1.2 var(--font); }
  .exTitle .sq { width:10px; height:10px; background:var(--acc); }
  .exSub { font-size:11.5px; line-height:1.45; color:var(--mute); }

  /* ---- monitors ---- */
  #mid { grid-row:2; grid-column:2; background:var(--panel); display:flex; flex-direction:column; min-width:0; min-height:0; }
  #well { flex:1; min-height:0; display:flex; justify-content:center; align-items:center; gap:28px; background:var(--well); padding:12px 16px 6px; overflow:hidden; position:relative; }
  .mon { display:flex; flex-direction:column; gap:6px; min-width:0; }
  #well.stacked { flex-direction:column; gap:14px; }
  .monHead { display:flex; align-items:center; gap:8px; font-size:11px; height:19px; white-space:nowrap; min-width:0; overflow:hidden; }
  .monHead .mute { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .monHead b { font-weight:800; letter-spacing:.1em; }
  #drawBtn { margin-left:auto; display:flex; align-items:center; gap:4px; padding:2px 7px; font-size:11px; font-weight:600; }
  #drawBtn.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .screen { position:relative; overflow:hidden; background:#000; }
  .screen canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #srcScreen { outline:1px solid var(--divider); }
  #progScreen { outline:2px solid var(--acc); outline-offset:2px; }
  #srcScreen.drawing canvas { cursor:crosshair; }
  #progBadge { position:absolute; left:6px; bottom:6px; background:rgba(21,20,20,.88); color:var(--ink); font-size:10px; padding:2px 6px; }
  #drawHint { position:absolute; width:max-content; max-width:200px; background:rgba(21,20,20,.92); border:1px solid var(--acc); color:var(--ink);
    font-size:10.5px; line-height:1.35; padding:4px 6px; pointer-events:none; }
  #drawHint span { color:var(--mute); }
  #transport { display:flex; align-items:center; justify-content:center; gap:16px; padding:10px 16px; border-top:2px solid var(--divider); flex:none; }
  #playBtn { width:38px; height:30px; display:grid; place-items:center; background:var(--text); color:var(--panel); border:0; padding:0; }
  #playBtn:hover:not(:disabled) { background:#fff; }
  #tc { font:800 22px/1 var(--font); letter-spacing:-.01em; }
  #tcDur { font-size:12px; color:var(--mute); }

  /* picker (no clip yet, or Open clip) */
  #picker { position:absolute; inset:0; background:var(--well); display:flex; align-items:center; justify-content:center; padding:24px; overflow:auto; z-index:5; }
  .pick { max-width:560px; display:flex; flex-direction:column; gap:14px; }
  .pick h1 { margin:0; font:800 26px/1.15 var(--font); letter-spacing:-.01em; }
  .pick p { margin:0; color:var(--mute); line-height:1.5; }
  .samples { display:flex; gap:8px; flex-wrap:wrap; }
  .samples button { font-size:14px; font-weight:600; padding:9px 14px; }
  .samples small { color:var(--mute); font-weight:400; font-size:12px; margin-left:6px; }
  .uploads { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--mute); }
  .filebtn { position:relative; overflow:hidden; display:inline-block; border:1px solid var(--divider); padding:6px 12px; cursor:pointer; color:var(--text); font-size:13px; }
  .filebtn:hover { background:color-mix(in srgb, var(--text) 7%, transparent); }
  .filebtn input { position:absolute; inset:0; opacity:0; cursor:pointer; }

  /* ---- agent ---- */
  #agent { grid-row:2; grid-column:3; display:flex; flex-direction:column; gap:9px; min-height:0; overflow:hidden; }
  #undoBtn { display:flex; align-items:center; gap:4px; border:0; padding:0; font-weight:600; letter-spacing:0; text-transform:none; color:var(--acc-hi); font-size:11px; }
  #undoBtn:hover:not(:disabled) { background:none; color:#b5c2ff; }
  #steps { display:flex; flex-direction:column; gap:6px; padding:10px 12px; background:var(--field); font-size:12px; line-height:1.4; flex:none; max-height:42%; overflow:auto; }
  #steps .sh { font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--acc-hi); font-weight:800; }
  .step { display:grid; grid-template-columns:14px 1fr; gap:6px; overflow-wrap:anywhere; }
  .step .mk { color:var(--acc-hi); }
  .step.now { font-weight:600; } .step.dim { color:var(--mute); } .step.err, .step.err .mk { color:var(--err); }
  .step b { font-weight:600; }
  .stepBar { margin-left:20px; height:3px; background:var(--hair); position:relative; overflow:hidden; }
  .stepBar i { position:absolute; top:0; bottom:0; width:35%; background:var(--acc); animation:indet 1.6s ease-in-out infinite; }
  .tally { display:flex; gap:6px; font-size:11px; align-items:center; }
  .tally span { padding:0 6px; border:1px solid var(--divider); color:var(--mute); }
  .tally span.yes { border-color:var(--acc); color:var(--acc-hi); }
  .tally button { margin-left:auto; border:0; padding:0; color:var(--mute); font-size:11px; }
  .tally button:hover { background:none; color:var(--text); }
  #steps pre { font:11px/1.45 var(--mono); background:var(--well); border:1px solid var(--hair); padding:8px; margin:0; max-height:200px; overflow:auto; white-space:pre-wrap; }
  #notice { font-size:12px; color:var(--mute); line-height:1.4; flex:none; }
  #notice:empty { display:none; }
  #notice.err { color:var(--err); }
  .tlist { display:flex; flex-direction:column; min-height:0; flex:1; }
  .trow { display:grid; grid-template-columns:28px minmax(0,1fr) 58px 58px; gap:6px; font-size:11.5px; padding:4px 0; border-bottom:1px solid var(--hair); }
  .trow.head { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); padding:0 0 4px; border-bottom:2px solid var(--divider); flex:none; }
  .tbody { overflow:auto; min-height:0; }
  .trow:not(.head) { cursor:pointer; }
  .trow:not(.head):hover { background:color-mix(in srgb, var(--text) 4%, transparent); }
  .trow .id { font-weight:800; }
  .trow .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trow .t { color:var(--mute); }
  .trow.sel { background:var(--acc-tint); box-shadow:inset 3px 0 0 var(--acc); font-weight:600; padding:4px 8px; margin:0 -8px; border-bottom-color:transparent; }
  .trow.sel .id { color:var(--acc-hi); } .trow.sel .t { color:var(--text); }
  .trow.spared { border-bottom-style:dashed; color:var(--mute); }
  .trow.group { cursor:default; }
  .tempty { font-size:12px; color:var(--mute); padding:8px 0; }
  #lowconf { display:flex; gap:6px; padding:7px 0 0; font-size:11.5px; color:var(--mute); align-items:flex-start; flex:none; }
  #lowconf i { width:2px; height:12px; margin-top:2px; background:var(--acc); flex:none; }
  #lowconf button { margin-left:auto; border:0; padding:0; color:var(--acc-hi); font-weight:600; font-size:11.5px; }
  #lowconf button:hover { background:none; color:#b5c2ff; }
  #selPanel { display:flex; flex-direction:column; gap:8px; padding-top:10px; border-top:2px solid var(--divider); flex:none; }
  .selHead { display:flex; align-items:baseline; gap:8px; min-width:0; }
  .selHead .sid { font:800 16px/1.2 var(--font); color:var(--acc-hi); }
  .selHead .snm { font:800 14px/1.2 var(--font); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .selHead .stm { margin-left:auto; font-size:11.5px; color:var(--mute); white-space:nowrap; }
  .selRow { display:flex; align-items:center; gap:8px; font-size:12px; flex-wrap:wrap; }
  .seg { display:flex; border:1px solid var(--divider); }
  .seg button { border:0; padding:4px 11px; font-size:12px; }
  .seg button + button { border-left:1px solid var(--divider); }
  .seg button.on { background:var(--acc); color:#fff; font-weight:600; }
  .seg button.on:hover:not(:disabled) { background:var(--acc-down); }
  #removeBtn { margin-left:auto; font-weight:600; font-size:12px; }
  .selHint { font-size:11px; color:var(--mute); }

  /* ---- timeline ---- */
  #timeline { grid-row:3; grid-column:1 / -1; background:var(--panel); display:flex; flex-direction:column; padding:8px 18px; gap:4px; min-height:0; }
  .tlHead { display:flex; align-items:center; gap:4px 12px; font-size:12px; flex:none; flex-wrap:wrap; }
  .legend { display:flex; align-items:center; gap:5px; color:var(--mute); }
  .legend.first { margin-left:auto; }
  .tlScroll { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }
  #tlGrid { position:relative; display:grid; grid-template-columns:240px minmax(0,1fr); }
  .rl { height:20px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--hair); font-size:12px; white-space:nowrap; overflow:hidden; cursor:pointer; min-width:0; }
  .rl .id { width:24px; font-weight:800; flex:none; }
  .rl .nm { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .rl .fx { margin-left:auto; padding-right:10px; font-size:11px; color:var(--mute); font-weight:400; }
  .rl.sel { color:var(--acc-hi); font-weight:800; } .rl.spared { color:var(--mute); } .rl.group { cursor:default; }
  .ruler { position:sticky; top:0; z-index:2; height:22px; background:var(--panel); border-bottom:2px solid var(--divider); cursor:pointer; }
  .ruler.corner { cursor:default; }
  .ruler span { position:absolute; top:0; bottom:0; padding:4px 0 0 4px; border-left:1px solid var(--divider); font-size:10.5px; color:var(--mute); pointer-events:none; }
  .lane { position:relative; height:20px; border-bottom:1px solid var(--hair); cursor:pointer; }
  .lane.sel { background:rgba(77,107,255,.08); }
  .lane .s { position:absolute; top:4px; bottom:4px; background:var(--seg); }
  .lane .x { position:absolute; top:9px; height:2px; background:var(--divider); }
  .lane .u { position:absolute; top:2px; bottom:2px; min-width:2px; margin-left:-1px; background:var(--acc-hi); }
  #ph { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--acc); pointer-events:none; z-index:3; }
  #ph span { position:absolute; top:0; left:1px; transform:translateX(-50%); background:var(--acc); color:#fff; font-size:10px; font-weight:800; padding:0 4px; white-space:nowrap; }

  /* hidden decoders: the monitors draw their frames on canvases */
  .decoder { position:fixed; left:0; top:0; width:2px; height:2px; opacity:0; pointer-events:none; }

  /* narrow screens: stack the panels and let the page scroll */
  @media (max-width:1100px) {
    body { overflow:auto; }
    #app { height:auto; grid-template-columns:minmax(0,1fr); grid-template-rows:52px auto 70vh auto 260px; }
    #left { grid-row:2; grid-column:1; } #reqPanel { flex:none; }
    #mid { grid-row:3; grid-column:1; }
    #agent { grid-row:4; grid-column:1; overflow:visible; } .tbody { max-height:240px; }
    #timeline { grid-row:5; }
    #tlGrid { grid-template-columns:140px minmax(0,1fr); }
    #fileMeta, #hdrNote { display:none; }
  }
</style>
</head>

// ---------- state ----------
const S = {

  desc: {},         // track_id -> what the VLM said yes to ("woman")
  vlm: {},          // track_id -> the VLM's latest answer about it: {q, a, p}
  trackList: null, maskFrames: null,  // GET /tracks, GET /masks, indexed per frame
  versions: [],     // {key, text, at, opIds, n, undone}
  selected: null,
  busy: null,       // null | 'request' | 'edit' | 'export'
  reqStart: 0, lastMs: null, steps: null, drawMode: false, picker: false,
  exportUrl: null, exportStats: null, exportSig: '', spotIdx: -1,
};
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
};
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  let j; try { j = await r.json(); } catch { j = { detail: `${r.status} ${r.statusText}` }; }
  if (!r.ok) throw Object.assign(j || {}, { status: r.status });
  return j;
};
const post = (path, body) => api(path, body === undefined ? { method: 'POST' } :

const fmt = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r.toFixed(0).padStart(2, '0')}`; };
const fmtF = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return `${m}:${r.toFixed(2).padStart(5, '0')}`; };
const fmtD = s => { const m = Math.floor(s / 60), r = s - m * 60; return `${String(m).padStart(2, '0')}:${r.toFixed(2).padStart(5, '0')}`; };
const dur = () => S.info ? S.info.n_frames / S.info.fps : 1;

const svg = name => { const t = document.createElement('template'); t.innerHTML = ICON[name]; return t.content.firstChild; };

// Per-viewer memory (request wording, target names) so a reopened video keeps its history. Optional: the page
// works the same without it.
const store = {
  key: () => `censor:${S.vid}`,
  load() { try { return JSON.parse(localStorage.getItem(this.key()) || 'null'); } catch { return null; } },
  save() {
    try { localStorage.setItem(this.key(), JSON.stringify({ name: S.name, ids: S.ids, desc: S.desc, vlm: S.vlm, versions: S.versions })); } catch {}
  },

// ---------- names, segments ----------
const LABELS = { 'license plate': 'Plate', 'face': 'Face', 'person': 'Person', 'user box': 'Your box' };
const ONE = { 'license plate': 'plate', 'face': 'face', 'person': 'person', 'user box': 'your box' };
const plural = { 'license plate': 'license plates', 'face': 'faces', 'person': 'people', 'user box': 'drawn boxes' };
const FX = { blur: 'blur', pixelate: 'pixelate', box: 'box' };
const MAX_ROWS = 8;  // target rows before they're grouped by kind
function union(spans) {
  const out = [];
  for (const [a, b] of [...spans].sort((x, y) => x[0] - y[0])) {
    const last = out[out.length - 1];
    if (last && a <= last[1] + 1 / S.info.fps) last[1] = Math.max(last[1], b); else out.push([a, b]);
  }
  return out;
}
const tid = id => S.ids[id] || (S.ids[id] = `T${Object.keys(S.ids).length + 1}`);
const tname = (id, label) => {
  const base = LABELS[label] || (label ? label[0].toUpperCase() + label.slice(1) : id);
  return S.desc[id] ? `${base} · ${S.desc[id]}` : base;
};
// Contiguous runs of keyframes (a gap of over half a second starts a new run), in seconds
function runs(kfs, pick = () => true) {
  const fps = S.info.fps, gap = Math.max(2, Math.round(fps / 2)), out = [];
  let a = null, b = null;
  for (const k of [...kfs].sort((x, y) => x.f - y.f)) {
    if (!pick(k)) continue;
    if (a !== null && k.f - b <= gap) { b = k.f; continue; }
    if (a !== null) out.push([a / fps, (b + 1) / fps]);
    a = b = k.f;
  }
  if (a !== null) out.push([a / fps, (b + 1) / fps]);
  return out;
}
// Every target: what the timeline masks, plus the people the vision model was asked about and the agent spared
// (a yes in an "except" request, a no in an "only" one). Unsure answers stay masked, so they're never here.
function targetList() {
  if (!S.timeline) return [];
  const out = Object.entries(S.timeline.targets).map(([id, t]) => ({
    id, chip: tid(id), label: t.label, name: tname(id, t.label), effect: t.effect, padding: t.padding, keyframes: t.keyframes,
    segs: runs(t.keyframes), unc: runs(t.keyframes, k => k.state === 'uncertain'), ext: [], spared: false,
  }));
  for (const tr of S.trackList || []) {
    if (S.timeline.targets[tr.track_id] || !S.vlm[tr.track_id]) continue;
    out.push({ id: tr.track_id, chip: tid(tr.track_id), label: tr.label, name: `${tname(tr.track_id, tr.label)} · spared`, effect: null,
      keyframes: tr.keyframes, segs: [], unc: [], ext: runs(tr.keyframes), spared: true, answer: S.vlm[tr.track_id].a });
  }
  return out.sort((a, b) => +a.chip.slice(1) - +b.chip.slice(1));
}
const span = t => { const all = [...t.segs, ...t.ext]; return all.length ? [Math.min(...all.map(s => s[0])), Math.max(...all.map(s => s[1]))] : null; };

// street_plates), one per kind ("113 faces") plus the selected target's own row
function rowsModel() {
  const ts = targetList();
  if (ts.length <= MAX_ROWS) return { rows: ts, grouped: false, ts };
  const kinds = new Map();
  for (const t of ts) {
    const key = `${t.spared ? 'spared:' : ''}${t.label}`;
    const k = kinds.get(key) || { id: null, key, group: true, label: t.label, n: 0, segs: [], ext: [], unc: [], spared: t.spared, effects: new Set() };
    k.n++; k.segs.push(...t.segs); k.ext.push(...t.ext); k.unc.push(...t.unc); if (t.effect) k.effects.add(t.effect); kinds.set(key, k);
  }
  const rows = [...kinds.values()].map(k => ({ ...k, segs: union(k.segs), ext: union(k.ext), unc: union(k.unc),
    chip: '', effect: [...k.effects].join('/') || null,
    name: `${k.n} ${k.n === 1 ? (ONE[k.label] || k.label) : plural[k.label] || k.label}${k.spared ? ' · spared' : ''}` }));
  const sel = ts.find(t => t.id === S.selected);

}
// Low-confidence spots: runs of uncertain keyframes, each masked anyway with extra padding
const spots = () => targetList().flatMap(t => t.unc.map(([a, b]) => ({ id: t.id, chip: t.chip, a, b })));
const curVersion = () => { const live = S.versions.filter(v => !v.undone); return live[live.length - 1]; };
const vNum = v => S.versions.indexOf(v) + 1;
const opsSig = () => S.ops.map(o => o.op_id + o.kind + o.targets.join()).join('|');
const exportFresh = () => !!S.exportUrl && S.exportSig === opsSig();

// ---------- loading a video ----------
async function refreshState() {
  const [v, tl, tracks, masks] = await Promise.all([api(`api/videos/${S.vid}`), api(`api/videos/${S.vid}/timeline`),
    api(`api/videos/${S.vid}/tracks`), api(`api/videos/${S.vid}/masks`)]);
  S.info = v.info; S.ops = v.ops; S.timeline = tl; S.queries = tracks.queries || [];
  indexLayers(tracks, masks);
  const present = new Set(S.ops.map(o => o.op_id));
  // A version whose ops left the log was undone. Sticky: op ids are reused after an undo.
  for (const ver of S.versions) if (ver.opIds.length && !ver.undone && ver.opIds.some(o => !present.has(o))) ver.undone = true;
  targetList(); store.save();
  setProgramSource();
  renderAll();
  return v;
}
// The upload scan finishes in the background: refresh the boxes when its tracks land
async function watchScan(vid, queries) {
  for (let i = 0; i < 60 && queries.length; i++) {
    await sleep(4000);
    if (S.vid !== vid) return;
    if (S.busy) continue;
    try {
      const tracks = await api(`api/videos/${vid}/tracks`);
      if ((tracks.queries || []).length !== (S.queries || []).length) await refreshState();
      if (queries.every(q => S.queries.includes(q))) { if (S.steps && S.steps.scan) { S.steps = null; renderAgent(); } return; }
    } catch { return; }
  }
}
async function openVideo(j, name) {
  Object.assign(S, { vid: j.video_id, info: j.info, name, timeline: null, trackList: null, maskFrames: null, ops: [], ids: {}, desc: {}, vlm: {}, versions: [], selected: null,
    exportUrl: null, exportStats: null, exportSig: '', steps: null, lastMs: null, spotIdx: -1, picker: false });
  const saved = store.load();
  if (saved) Object.assign(S, { name: saved.name || name, ids: saved.ids || {}, desc: saved.desc || {}, vlm: saved.vlm || {},
    versions: (saved.versions || []).map(({ card, ...v }) => v) });
  if (!S.versions.length) S.versions.push({ key: 'upload', text: 'Upload', at: Date.now(), opIds: [], n: 0, undone: false });
  history.replaceState(null, '', `?video=${S.vid}`);
  $('player').src = `api/videos/${S.vid}/source`; $('expPlayer').removeAttribute('src');
  $('text').disabled = false; $('text').placeholder = 'What should be hidden?';
  const v = await refreshState();
  if (saved && S.versions.length > 1) {
    S.steps = { head: 'What the agent did', lines: [{ mark: '–', text: `Reopened ${S.name}: ${v.summary.n_targets} target${v.summary.n_targets === 1 ? '' : 's'} masked so far. The steps of earlier requests aren't kept.` }] };
  } else if (j.prescan && j.prescan.length) {
    S.steps = { head: 'Getting ready', scan: true, lines: [{ mark: '◐', now: true, bar: true, text: `Scanning for ${j.prescan.map(q => plural[q] || q).join(', ')} in the background, so the first request is quick.` }] };
  }

  renderAll(); layoutMonitors();

}

// ---------- the agent's steps, in plain words ----------
function describe(calls, path) {
  const lines = [], add = (text, cls) => lines.push({ mark: cls === 'err' ? '!' : '–', text, cls });
  const tally = { yes: 0, no: 0, unknown: 0 };
  // A crowd's 113 faces read as a count, not 113 ids
  const names = ids => { const t = ids.map(i => tid(i)); return t.length <= 6 ? t.join(', ') : `${t.slice(0, 3).join(', ')} and ${t.length - 3} more`; };
  if (path === 'template') add('Understood the request directly, no language model needed.');
  for (const c of calls) {
    const a = c.args || {}, r = c.result, ms = c.ms !== undefined ? ` (${c.ms < 1000 ? c.ms + ' ms' : (c.ms / 1000).toFixed(1) + ' s'})` : '';
    if (c.error) { add(c.tool === '_plan' ? `The language model couldn't plan it: ${c.error}` : `${c.tool} failed: ${c.error}`, 'err'); continue; }
    switch (c.tool) {
      case '_plan': {
        const p = c.plan || {}, ts = (p.targets || []).map(t => [t.object, t.only && t.only.length ? `only "${t.only.join('", "')}"` : '',
          t.exclude && t.exclude.length ? `except "${t.exclude.join('", "')}"` : '', t.time ? `at ${Array.isArray(t.time) ? t.time.map(fmt).join('–') : t.time}` : '']
          .filter(Boolean).join(' '));
        add(el('span', {}, `Planned with the on-device LLM${ms}: `, el('b', {}, `${p.action || 'mask'}${p.action === 'mask' || !p.action ? ' (' + (p.effect || 'blur') + ')' : ''}`),
          ts.length ? ` ${ts.join('; ')}` : ''));
        break;
      }
      case 'resolve_time': add(el('span', {}, `Read "${a.phrase}" as `, el('b', {}, `${fmt(r[0])}–${fmt(r[1])}`))); break;
      case 'find_objects': {
        const n = r.length, what = plural[a.query] || a.query;
        add(el('span', {}, `Looked for ${what}${a.time_range ? ` between ${fmt(a.time_range[0])} and ${fmt(a.time_range[1])}` : ''}: `,
          el('b', {}, n ? `${n} track${n === 1 ? '' : 's'}` : 'none found'), n ? ` (${names(r.map(o => o.track_id))})` : '', ms));
        break;
      }
      case 'check_attribute': {
        const t = { yes: 0, no: 0, unknown: 0 };
        r.forEach(x => { t[x.answer] = (t[x.answer] || 0) + 1; tally[x.answer] = (tally[x.answer] || 0) + 1; });
        const m = /^is (?:this|it) (?:a |an |the )?(.+?)\?*$/i.exec(a.question || '');
        if (m) r.forEach(x => { if (x.answer === 'yes') S.desc[x.track_id] = m[1]; });
        r.forEach(x => { S.vlm[x.track_id] = { q: a.question || '', a: x.answer, p: x.p_yes }; });
        add(`Asked "${a.question}" about ${r.length} ${r.length === 1 ? 'track' : 'tracks'}${ms}: ${t.yes} yes, ${t.no} no, ${t.unknown} unsure${t.unknown ? ' (unsure stays masked)' : ''}`);
        break;
      }
      case 'person_for': add('Matched each face to the person it belongs to'); break;
      case 'add_masks': {
        const ids = [...(a.track_ids || [])];
        add(el('span', {}, `${{ blur: 'Blurred', pixelate: 'Pixelated', box: 'Covered' }[a.effect || 'blur'] || a.effect} `,
          el('b', {}, ids.length ? names(ids) : (a.labels || []).join(', ')),
          a.time_range ? ` from ${fmt(a.time_range[0])} to ${fmt(a.time_range[1])}` : ' for the whole clip'));
        break;
      }
      case 'remove_masks': add(el('span', {}, 'Removed the mask from ', el('b', {}, names(a.track_ids || [])))); break;
      case 'set_effect': add(el('span', {}, 'Switched ', el('b', {}, names(a.track_ids || [])), ` to ${a.effect}`)); break;
      case 'add_rule': add(`Added a rule: ${a.effect || 'blur'} every ${a.category}`); break;
      case 'undo': add(r ? `Undid ${r}` : 'There was nothing to undo'); break;
      case 'track_box': add(el('span', {}, 'Tracked the drawn box from ', el('b', {}, `${fmt(r.start)} to ${fmt(r.end)}`))); break;
      default: add(`${c.tool}${ms}`);

}
const opIdsOf = calls => calls.filter(c => !c.error && ['add_masks', 'remove_masks', 'set_effect', 'add_rule'].includes(c.tool) && typeof c.result === 'string').map(c => c.result);

// ---------- actions ----------
let ticker = null;
function setBusy(kind) {
  S.busy = kind || null;
  clearInterval(ticker); ticker = null;
  if (kind === 'request') ticker = setInterval(() => { renderRequest(); renderAgentHead(); }, 500);
  if (kind) toggleDraw(false);
  renderAll();
}
function workingSteps(text, first) {
  return { head: 'Working', lines: [
    { mark: '◐', now: true, bar: true, text: `Working on "${text}"` },
    { mark: '○', dim: true, text: first ? 'The first request on a new clip waits for its scan (faces, plates, people).'
      : 'Plain requests take a moment; ones that need the language model or many person checks take longer.' },
  ] };
}
async function sendRequest(text) {
  if (!S.vid || S.busy || !text.trim()) return;
  if (/^\s*undo\s*$/i.test(text)) { $('text').value = ''; return undoLast(); }
  const first = S.versions.length === 1;
  S.reqStart = Date.now(); S.steps = workingSteps(text, first); notice('');
  setBusy('request');
  let j;
  try {
    j = await post(`api/videos/${S.vid}/request`, { text });
  } catch (err) {
    if (err && err.detail !== undefined) {
      S.steps = { head: 'What the agent did', lines: [{ mark: '!', cls: 'err', text: `That request failed: ${errText(err)}` }] };
      setBusy(); return;
    }
    // No answer from the app: a proxy in front of it (AUP's gives up after ~100 s) dropped the connection while
    // the server keeps working. Wait for it to finish, so nothing runs before the masks exist.
    S.steps.lines[1] = { mark: '○', dim: true, text: 'The connection dropped, but the server is still working on it. Waiting…' }; renderAgent();
    try {
      let v; do { await sleep(3000); v = await api(`api/videos/${S.vid}`); } while (v.busy);
      S.lastMs = Date.now() - S.reqStart;
      S.versions.push({ key: `lost_${Date.now()}`, text, at: Date.now(), opIds: [], n: v.summary.n_targets, undone: false });
      S.steps = { head: 'What the agent did', lines: [{ mark: '–', text: `The server finished: ${v.summary.n_targets} target(s) masked now. The connection dropped before its answer came back, so the steps aren't shown.` }] };
      await refreshState(); setBusy(); return;
    } catch (e2) {
      S.steps = { head: 'What the agent did', lines: [{ mark: '!', cls: 'err', text: `That request failed: ${errText(e2)}` }] };
      setBusy(); return;
    }
  }
  S.lastMs = Date.now() - S.reqStart;
  const ops = opIdsOf(j.calls), d = describe(j.calls, j.path);
  if (ops.length) S.versions.push({ key: j.request_id, text, at: Date.now(), opIds: ops, n: j.summary.n_targets, undone: false });
  const lines = d.lines;
  if (!ops.length && j.message) lines.push({ mark: '–', text: j.message, cls: j.path === 'clarify' ? '' : '' });
  S.steps = { head: 'What the agent did', lines, tally: d.tally, calls: j.calls, path: j.path, showCalls: false };
  const added = j.calls.filter(c => c.tool === 'add_masks' && !c.error).flatMap(c => c.args.track_ids || []);
  await refreshState();
  // Land on the first thing this request masked, like the review state of the design
  const firstT = targetList().find(t => added.includes(t.id) && t.segs.length);
  if (firstT) { S.selected = firstT.id; seek((firstT.segs[0][0] + firstT.segs[0][1]) / 2); }
  setBusy(); $('text').focus();
}
async function sendBox(frame, box) {
  if (S.busy || !S.vid) return;

  setBusy('edit'); notice('Tracking the box through the clip…');
  try {
    const j = await post(`api/videos/${S.vid}/box`, { frame, box });
    S.versions.push({ key: `box_${j.op_id}_${Date.now()}`, text: `Drawn box on frame ${frame}`, at: Date.now(), opIds: [j.op_id], n: j.summary.n_targets, undone: false });
    S.selected = j.track.track_id;
    await refreshState();
    notice(`Added ${tid(j.track.track_id)}: tracked from ${fmt(j.track.start)} to ${fmt(j.track.end)} and blurred wherever it was followed. Change its effect below.`);
  } catch (e) { notice(`Couldn't track that box: ${errText(e)}`, true); }

// Undo the latest version: every op it added (a request can add several), not just the last op
async function undoLast() {
  if (S.busy || !S.vid) return;
  const ver = [...S.versions].reverse().find(v => !v.undone && v.opIds.length);
  if (!ver) { notice('Nothing to undo.'); return; }
  setBusy('edit');
  try {
    for (let i = 0; i < 20; i++) {
      const last = S.ops[S.ops.length - 1];
      if (!last || !ver.opIds.includes(last.op_id)) break;
      await post(`api/videos/${S.vid}/undo`);
      S.ops = (await api(`api/videos/${S.vid}`)).ops;
    }
    ver.undone = true;
    await refreshState();
    const n = S.timeline ? Object.keys(S.timeline.targets).length : 0;
    S.steps = { head: 'What the agent did', lines: [{ mark: '–', text: `Undid v${vNum(ver)} ("${ver.text}"). ${n} target${n === 1 ? '' : 's'} masked now.` }] };
    notice('');
  } catch (e) { notice(`Undo failed: ${errText(e)}`, true); }
  setBusy();
}
async function doExport() {

  setBusy('export'); notice('');
  try {
    const j = await post(`api/videos/${S.vid}/export`);
    S.exportUrl = j.url; S.exportStats = j.stats; S.exportSig = opsSig();
    setProgramSource();

}
async function editTargets(action, ids, effect = 'blur') {
  if (S.busy || !S.vid) return;
  const names = ids.map(i => `${tid(i)} (${tname(i, (S.timeline.targets[i] || (S.trackList || []).find(t => t.track_id === i) || {}).label)})`).join(', ');
  const text = action === 'remove' ? `Unmasked ${names}` : action === 'add' ? `Masked ${names} with ${effect}` : `Changed ${names} to ${effect}`;
  setBusy('edit');
  try {
    const j = await post(`api/videos/${S.vid}/targets`, { action, track_ids: ids, effect });
    S.versions.push({ key: `edit_${j.op_id}_${Date.now()}`, text, at: Date.now(), opIds: [j.op_id], n: j.summary.n_targets, undone: false });
    await refreshState();
    notice(`${text}. Undo reverts it.`);
  } catch (e) { notice(`That edit failed: ${errText(e)}`, true); }
  setBusy();
