<!doctype html>
<!-- Minimal test UI for M1 (role D replaces this with the React app in web/). Talks to censor/server/app.py. -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Censor Agent</title>
<style>
  :root { --bg:#111; --fg:#eee; --muted:#999; --line:#333; --accent:#e5484d; }
  body { margin:0; font:14px system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:12px; grid-template-columns:1fr 340px; }
  @media (max-width:800px){ main { grid-template-columns:1fr; } }
  .panel { border:1px solid var(--line); border-radius:8px; padding:12px; }
  video, #stage { width:100%; border-radius:6px; background:#000; display:block; }
  #wrap { position:relative; } #draw { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
  input[type=text] { width:100%; box-sizing:border-box; padding:8px; background:#1b1b1b; color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  button { padding:7px 12px; background:#222; color:var(--fg); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  #log { max-height:360px; overflow:auto; font:12px ui-monospace, monospace; white-space:pre-wrap; color:var(--muted); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  h1 { font-size:16px; margin:0 0 8px; }
</style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Censor Agent</h1>
    <div class="row"><select id="sample"><option value="">Load a sample clip…</option></select>
      <input type="file" id="file" accept="video/*"><input type="file" id="sidecar" accept=".json" title="stub mode: ground-truth tracks"></div>
    <video id="player" controls></video>
    <div class="row"><span id="time">frame 0</span><button id="prev">Preview masked frame</button><small>Drag on the preview to draw a box.</small></div>
    <div id="wrap"><img id="stage" alt=""><canvas id="draw"></canvas></div>
  </section>
  <aside class="panel">
    <form id="ask"><input type="text" id="text" placeholder='e.g. "blur all plates and the person in the red shirt"'></form>
    <div class="row"><button id="undo">Undo</button><button id="export" class="primary">Export</button><a id="dl" hidden>Download</a></div>
    <div id="status" style="margin:6px 0;font-weight:600"></div>
    <div id="summary"></div>
    <div id="log"></div>
  </aside>
</main>
<script>
let vid = null, info = null;
const $ = id => document.getElementById(id);
const log = x => { $('log').textContent = (typeof x === 'string' ? x : JSON.stringify(x, null, 1)) + '\n\n' + $('log').textContent; };
const frameNow = () => info ? Math.min(info.n_frames - 1, Math.round($('player').currentTime * info.fps)) : 0;
const api = async (path, opts) => { const r = await fetch(path, opts); const j = await r.json(); if (!r.ok) throw j; return j; };
const showSummary = s => $('summary').textContent = s ? `${s.n_targets} targets · ${JSON.stringify(s.by_label)} · ${s.n_ops} ops` : '';

$('file').onchange = async e => {
  const fd = new FormData(); fd.append('file', e.target.files[0]);
  const j = await api('api/videos', { method: 'POST', body: fd });
  vid = j.video_id; info = j.info; $('player').src = `api/videos/${vid}/source`; log(j);
};
// ?video=<id> reopens a video uploaded earlier (or through the API), with its masks so far
const reopen = new URLSearchParams(location.search).get('video');
if (reopen) api(`api/videos/${reopen}`).then(j => {
  vid = reopen; info = j.info; $('player').src = `api/videos/${vid}/source`; log(j); showSummary(j.summary); refresh();
}).catch(log);
// Sample clips already on the server: no file picker needed (the in-app browser and demos can't always open one)
api('api/samples').then(list => list.forEach(c => $('sample').add(new Option(`${c.id} (${c.mb} MB)`, c.id)))).catch(log);
$('sample').onchange = async e => {
  if (!e.target.value) return;
  const j = await api(`api/samples/${e.target.value}`, { method: 'POST' });
  vid = j.video_id; info = j.info; $('player').src = `api/videos/${vid}/source`; log(j); showSummary(null); refresh();
};
$('sidecar').onchange = async e => {
  if (!vid) return log('upload a video first');
  const fd = new FormData(); fd.append('file', e.target.files[0]);
  log(await api(`api/videos/${vid}/tracks-sidecar`, { method: 'POST', body: fd }));
};
$('player').ontimeupdate = () => $('time').textContent = `frame ${frameNow()}`;
const refresh = () => { if (vid) $('stage').src = `api/videos/${vid}/preview/${frameNow()}.jpg?t=${Date.now()}`; };
$('prev').onclick = refresh;
// One thing at a time, with a visible status: an Export started while a request was still waiting on the
// detector used to render the video with no masks at all.
const busy = (msg) => { $('status').textContent = msg || ''; ['text', 'undo', 'export', 'sample'].forEach(id => $(id).disabled = !!msg); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
$('ask').onsubmit = async e => {
  e.preventDefault(); if (!vid) return log('pick a sample clip or upload a video first');
  busy('Working on: ' + $('text').value + ' (the first request on a new video waits for its scan)');
  try {
    const j = await api(`api/videos/${vid}/request`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ text: $('text').value }) });
    log(j); showSummary(j.summary); refresh();
    busy(); $('status').textContent = j.message + ' Click Export to render it.';
  } catch (err) {
    log(err);
    if (err && err.detail !== undefined) { busy(); $('status').textContent = 'Request failed, see the log below.'; return; }
    // Not an answer from the app: AUP's proxy gives up after about 100 s (the LLM path can take longer) while
    // the server keeps working. Wait for it to finish, so Export doesn't run before the masks exist.
    $('status').textContent = 'The connection dropped, but the server is still working on it. Waiting…';
    try {
      let j; do { await sleep(3000); j = await api(`api/videos/${vid}`); } while (j.busy);
      showSummary(j.summary); refresh();
      busy(); $('status').textContent = `The server finished: ${j.summary.n_targets} targets now. Check the preview, then click Export.`;
    } catch (e2) { busy(); $('status').textContent = 'Request failed, see the log below.'; log(e2); }
  }
};
$('undo').onclick = async () => { const j = await api(`api/videos/${vid}/undo`, { method: 'POST' }); log(j); showSummary(j.summary); refresh(); };
$('export').onclick = async () => {
  if (!vid) return log('pick a sample clip or upload a video first');
  // An export with no masks is just the original video: say so instead of producing one that looks censored
  const cur = await api(`api/videos/${vid}`).catch(() => null);
  if (cur && !cur.busy && cur.summary.n_targets === 0) { $('status').textContent = 'No masks yet: send a request first.'; return; }
  busy('Rendering the blurred video… (waits for a request that is still running)');
  let j;
  try { j = await api(`api/videos/${vid}/export`, { method: 'POST' }); }
  catch (err) { busy(); $('status').textContent = (err && err.detail) || 'Export failed, see the log below.'; return log(err); }
  busy(); $('status').textContent = `Done: ${j.stats.masked_boxes} masked boxes over ${j.stats.frames} frames. The player now shows the blurred video.`;
  // j.url names this render (?v=...), so neither the player nor the download link can get an older, cached file
  log(j); $('dl').href = j.url; $('dl').textContent = 'Download export.mp4'; $('dl').hidden = false;
  $('player').src = j.url;  // play the blurred result, not the original
};
// draw-a-box on the preview image
const cv = $('draw'); let start = null;
const toVideo = ev => { const r = cv.getBoundingClientRect(); return [ (ev.clientX - r.left) / r.width * info.width, (ev.clientY - r.top) / r.height * info.height ]; };
cv.onmousedown = ev => { if (info) start = toVideo(ev); };
cv.onmouseup = async ev => {
  if (!start) return; const end = toVideo(ev);
  const box = [Math.min(start[0], end[0]), Math.min(start[1], end[1]), Math.max(start[0], end[0]), Math.max(start[1], end[1])]; start = null;
  if (box[2] - box[0] < 8 || box[3] - box[1] < 8) return;
  try { const j = await api(`api/videos/${vid}/box`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ frame: frameNow(), box }) }); log(j); showSummary(j.summary); refresh(); }
  catch (err) { log(err); }
};
</script>
</body>
</html>
